{% extends "base.html" %}

{% block content %}

<div class="auth-page">
    <div class="card auth-card">
        <a href="/" class="auth-card__brand">
            <span class="app-nav__mark">SB</span>
            <span>SplitBills</span>
        </a>
        <h1>Welcome back</h1>
        <p class="text-caption">Log in to manage groups, receipts, and payments.</p>
        <form method="POST" class="form-stack">
            <label class="sr-only" for="login-email">Email</label>
            <input class="input-field" type="email" name="email" id="login-email" placeholder="Email" autocomplete="email" required>
            <label class="sr-only" for="login-password">Password</label>
            <input class="input-field" type="password" name="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
            <button class="btn-primary btn-block" type="submit">Log in</button>
        </form>
        <p class="auth-switch">No account? <a href="/register">Sign up</a></p>
    </div>
</div>

{% endblock %}
