{% from "macros/ui.html" import user_avatar %}

<aside class="sidebar">

    <h2>SplitBills</h2>

    {% if current_user.is_authenticated %}
    <div class="sidebar-profile">
        {{ user_avatar(current_user, 'md', 'sidebar-avatar') }}
        <div class="sidebar-user-info">
            <span class="sidebar-user-name">{{ current_user.name }}</span>
            <span class="sidebar-user-role">Member</span>
        </div>
    </div>

    <ul>
        <li>
            <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active-nav"{% endif %}>Dashboard</a>
        </li>
        <li>
            <a href="{{ url_for('dashboard_groups') }}" {% if request.endpoint in ['dashboard_groups', 'group_details', 'expense_detail', 'add_expense', 'settlement', 'create_group'] %}class="active-nav"{% endif %}>Groups</a>
        </li>
        <li>
            <a href="{{ url_for('expenses') }}" {% if request.endpoint == 'expenses' %}class="active-nav"{% endif %}>All expenses</a>
        </li>
        <li>
            <a href="{{ url_for('analytics') }}" {% if request.endpoint == 'analytics' %}class="active-nav"{% endif %}>Analytics</a>
        </li>
        <li>
            <a href="{{ url_for('logout') }}" class="sidebar-logout">Logout</a>
        </li>
    </ul>

    <div class="theme-toggle">
        <button type="button" data-theme-toggle>Toggle dark mode</button>
    </div>

    {% endif %}

</aside>
