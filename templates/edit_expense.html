{% extends "base.html" %}

{% block content %}

    <main class="app-main">

        <header class="page-head">
            <div>
                <h1>Edit expense</h1>
                <p class="text-caption">{% if trip is defined %}{{ trip.trip_name }}{% else %}One-off split{% endif %}</p>

        <div class="card">

    </main>
</div>

{% include "partials/add_expense_scripts.html" %}

{% endblock %}
